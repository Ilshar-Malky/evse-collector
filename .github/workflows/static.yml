name: Static chargers

# Downloads the static data of every charger (location, operator, power) with the
# token saved in the repository secrets. Once a week (Monday 04:10 UTC) + by hand:
# Actions -> "Static chargers" -> Run workflow.
on:
  schedule:
    - cron: "10 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Download static charger data
        env:
          ECO_MOVEMENT_TOKEN: ${{ secrets.ECO_MOVEMENT_TOKEN }}
        run: python collector/fetch_static.py

      - name: Commit results
        run: |
          git config user.name "evse-collector-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static
          git commit -m "static: chargers $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
